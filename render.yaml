services:
  - type: web
    name: ame-dt-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    healthCheckPath: /api/health
    envVars:
      - key: AME_ADMIN_PIN
        generateValue: true
      - key: AME_BRIDGE_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
