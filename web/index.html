<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><title>AME DT Upload</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#0f172a}.top{background:#0f172a;color:white;padding:18px 22px;display:flex;justify-content:space-between}.brand{font-size:20px;font-weight:800}.pill{font-size:12px;padding:6px 10px;border-radius:99px;background:#334155}.wrap{max-width:900px;margin:28px auto;padding:0 18px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0f172a12;margin-bottom:18px}.doc{border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-top:12px}.row{display:flex;gap:10px;flex-wrap:wrap}input{padding:12px;border:1px solid #cbd5e1;border-radius:10px;min-width:190px;flex:1}button{border:0;border-radius:11px;padding:12px 15px;font-weight:700;background:#0f172a;color:white;cursor:pointer}.secondary{background:#e2e8f0;color:#0f172a}.muted{color:#64748b}.state{font-weight:800;color:#0369a1}@media(max-width:600px){.wrap{margin:14px auto}.card{padding:16px}button,input{width:100%}}</style></head><body><header class="top"><div class="brand">AME DT Upload</div><div class="pill">ONLINE</div></header><main class="wrap"><section class="card"><h2>Document Queue</h2><p class="muted">Scanned PDFs stay on the office PC. Select a document, driver and DT to send the ERP job.</p><div class="row"><button onclick="load()">Refresh</button><button class="secondary" onclick="location.href='/admin'">Admin</button></div><div id="queue"><p class="muted">Loading…</p></div></section></main><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){let q=document.getElementById('queue');try{let r=await fetch('/api/documents');let a=await r.json();if(!a.length){q.innerHTML='<p class="muted">Waiting for office bridge / scanner document…</p>';return}q.innerHTML=a.map(d=>`<div class="doc"><b>${esc(d.filename)}</b> <span class="state">${esc(d.state)}</span><p class="muted">${esc(d.message||'Ready')}</p>${d.state==='waiting'||d.state==='error'?`<div class="row"><input id="driver-${d.id}" placeholder="Driver name"><input id="dt-${d.id}" placeholder="DT/CWH/26/02312"><button onclick="submitDoc('${d.id}')">Upload to ERP</button></div>`:''}</div>`).join('')}catch(e){q.innerHTML='<p class="muted">Portal backend unavailable.</p>'}}async function submitDoc(id){let driver=document.getElementById('driver-'+id).value.trim(),dt=document.getElementById('dt-'+id).value.trim();let r=await fetch('/api/documents/'+id+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({driver,dt})});let x=await r.json();if(!r.ok)alert(x.error||'Unable to submit');load()}load();setInterval(load,5000)</script></body></html>
