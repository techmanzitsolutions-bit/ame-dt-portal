<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest">
<title>AME DT Upload</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#0f172a}.top{background:#0f172a;color:white;padding:18px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800}.pill{font-size:12px;padding:6px 10px;border-radius:99px;background:#334155}.wrap{max-width:900px;margin:28px auto;padding:0 18px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0f172a12;margin-bottom:18px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:#0f172a;color:white}.secondary{background:#e2e8f0;color:#0f172a}.queue{padding:18px;border:1px solid #e2e8f0;border-radius:14px;margin-top:14px}.muted{color:#64748b}.status{font-weight:800;color:#0369a1}@media(max-width:600px){.wrap{margin:14px auto}.top{padding:15px}.card{padding:16px;border-radius:14px}button{width:100%}}
</style></head>
<body><header class="top"><div class="brand">AME DT Upload</div><div class="pill">ONLINE</div></header>
<main class="wrap">
<section class="card"><h2>Document Queue</h2><p class="muted">Scanner documents will appear here when the office AME Bridge is connected.</p><div class="row"><button onclick="refreshQueue()">Refresh Queue</button><button class="secondary" onclick="location.href='admin.html'">Admin Setup</button></div><div id="queue" class="queue"><span class="status">Waiting for bridge…</span><br><span class="muted">No synchronized documents yet.</span></div></section>
<section class="card"><b>Production flow</b><p class="muted">Office scanner → PC storage → secure bridge → this portal → driver/DT → ERP worker → verified upload.</p></section>
</main><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');function refreshQueue(){document.getElementById('queue').innerHTML='<span class="status">Checking…</span><br><span class="muted">Backend connection will be enabled in the deployment stage.</span>'}</script></body></html>
