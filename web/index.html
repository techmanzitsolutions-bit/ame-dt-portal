<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><title>AME Logistics Scan Desk</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;background:#f3f6fa;color:#132238}.top{height:68px;background:#0b1220;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-size:20px;font-weight:800}.sub{font-size:12px;color:#aebbd0}.online{background:#123d31;color:#69e6b4;border:1px solid #26664f;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:800}.nav{background:#fff;border-bottom:1px solid #dde5ee;padding:0 28px;display:flex;gap:28px;height:52px;align-items:center}.nav a{font-size:13px;font-weight:800;color:#627187;text-decoration:none}.nav .active{color:#1261a0;border-bottom:3px solid #1261a0;height:52px;display:flex;align-items:center}.wrap{max-width:1120px;margin:24px auto;padding:0 20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid #e0e7ef;border-radius:14px;box-shadow:0 5px 20px #17324d0b}.stat{padding:18px}.num{font-size:28px;font-weight:850}.label,.meta,.message{font-size:12px;color:#708096}.panel{overflow:hidden}.panelhead{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #e7edf3}.panelhead h2{font-size:16px;margin:0}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:#1261a0;color:#fff}.light{background:#edf2f7;color:#30445c}.danger{background:#a92c2c}.queue{padding:18px}.empty{text-align:center;padding:50px 20px;color:#75869a}.doc{border:1px solid #dce5ee;border-radius:12px;padding:17px;margin-bottom:12px}.docTop{display:flex;justify-content:space-between;gap:12px}.file{font-weight:800}.badge{font-size:11px;font-weight:850;text-transform:uppercase;background:#e9f4ff;color:#1261a0;padding:5px 9px;border-radius:20px;height:max-content}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions input,.actions select{border:1px solid #cdd8e4;border-radius:9px;padding:10px 11px;min-width:220px;flex:1}.newscan{font-size:11px;color:#168052;font-weight:850;margin-bottom:5px}.footer{text-align:center;color:#8b98a8;font-size:11px;padding:18px}@media(max-width:700px){.top,.nav{padding-left:15px;padding-right:15px}.wrap{padding:0 10px}.stats{grid-template-columns:1fr}.actions>*{width:100%}}</style></head><body><header class="top"><div><div class="brand">AME Logistics Scan Desk</div><div class="sub">Dispatch Room · Online Portal</div></div><div class="online">● CONNECTED</div></header><nav class="nav"><a class="active" href="/">SCAN QUEUE</a><a href="/admin">ACCOUNTS</a><a href="/admin">SETUP</a></nav><main class="wrap"><section class="stats"><div class="stat"><div class="num" id="waiting">0</div><div class="label">Waiting</div></div><div class="stat"><div class="num" id="processing">0</div><div class="label">Processing</div></div><div class="stat"><div class="num" id="uploaded">0</div><div class="label">Uploaded</div></div></section><section class="panel"><div class="panelhead"><h2>Scanner Queue</h2><button class="btn light" onclick="load()">Refresh</button></div><div class="queue" id="queue"><div class="empty">Checking scanner queue…</div></div></section><div class="footer">AME DT Upload · Scanned documents remain on the office PC</div></main><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');let drivers=[];const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const q=document.getElementById('queue');try{drivers=await (await fetch('/api/drivers')).json();const a=await (await fetch('/api/documents')).json();waiting.textContent=a.filter(x=>['waiting','error','needs_decision'].includes(x.state)).length;processing.textContent=a.filter(x=>['queued','processing'].includes(x.state)).length;uploaded.textContent=a.filter(x=>x.state==='uploaded').length;if(!a.length){q.innerHTML='<div class="empty"><b>No scanned document waiting</b><br><br>New PDFs from the office scanner will appear here automatically.</div>';return}const opts='<option value="">Select Driver</option>'+drivers.map(x=>`<option>${esc(x.name)}</option>`).join('');q.innerHTML=a.map(d=>`<article class="doc"><div class="docTop"><div><div class="newscan">${d.state==='waiting'?'NEW SCAN':''}</div><div class="file">${esc(d.filename)}</div><div class="meta">Office Scanner · ${d.size?Math.ceil(d.size/1024)+' KB':''}</div></div><span class="badge">${esc(d.state)}</span></div><div class="message">${esc(d.message||'Ready')}</div>${['waiting','error'].includes(d.state)?`<div class="actions"><select id="driver-${d.id}">${opts}</select><input id="dt-${d.id}" placeholder="DT/CWH/26/02312"><button class="btn" onclick="submitDoc('${d.id}')">Claim & Upload</button></div>`:''}${d.state==='needs_decision'?`<div class="actions"><button class="btn" onclick="decision('${d.id}','replace')">Replace Existing</button><button class="btn danger" onclick="decision('${d.id}','discard')">Discard New Scan</button></div>`:''}</article>`).join('')}catch(e){q.innerHTML='<div class="empty">Portal backend unavailable. Retrying…</div>'}}async function submitDoc(id){let driver=document.getElementById('driver-'+id).value,dt=document.getElementById('dt-'+id).value.trim();if(!driver||!dt)return alert('Select driver and enter DT.');let r=await fetch('/api/documents/'+id+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({driver,dt})});let x=await r.json();if(!r.ok)alert(x.error||'Unable to submit');load()}async function decision(id,choice){let r=await fetch('/api/documents/'+id+'/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choice})});if(!r.ok)alert((await r.json()).error||'Unable to continue');load()}load();setInterval(load,4000)</script></body></html>
